# nginx config for the static Todo app (Daily Ledger).
# Serves the built static files from /usr/share/nginx/html.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long-lived cache for fingerprinted assets; the app has no build step,
    # so CSS/JS are cached with a short max-age and revalidated.
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never serve dotfiles / deployment internals
    location ~ /\. {
        deny all;
        return 404;
    }
}
