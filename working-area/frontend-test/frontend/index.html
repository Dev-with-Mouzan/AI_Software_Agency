<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#191f2d" />
  <title>Daily Ledger — Todo List</title>
  <meta name="description" content="A quiet, paper-style todo list that saves to your browser." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="shell">
    <section class="card" aria-labelledby="page-title">
      <header class="ledger-header">
        <p class="eyebrow">Daily Ledger</p>
        <h1 class="title" id="page-title">What needs doing?</h1>
        <p class="subtitle">Tasks live only in this browser — no account, no cloud.</p>
      </header>

      <form id="add-form" class="add-form" autocomplete="off">
        <label class="sr-only" for="new-task">New task</label>
        <input id="new-task" name="new-task" type="text" placeholder="Add a task…" maxlength="300" required />
        <button type="submit" class="btn btn--add">Add</button>
      </form>

      <nav class="filters" aria-label="Filter tasks">
        <button type="button" class="filter" data-filter="all" aria-pressed="true">All</button>
        <button type="button" class="filter" data-filter="active" aria-pressed="false">Active</button>
        <button type="button" class="filter" data-filter="completed" aria-pressed="false">Completed</button>
      </nav>

      <div class="list-wrap">
        <ul id="todo-list" class="todo-list" role="list"></ul>
        <p id="empty-state" class="empty-state" hidden>Nothing here yet — add your first task above.</p>
      </div>

      <footer class="ledger-footer">
        <p id="counter" class="counter" aria-live="polite" aria-atomic="true">0 items left</p>
        <button type="button" id="clear-completed" class="btn btn--ghost" disabled>Clear completed</button>
      </footer>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
